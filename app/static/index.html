<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Mapper</title>
<style>
  :root {
    --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6a66; --line: #e3e1da; --card: #ffffff;
    --accent: #0f6e56; --warn-bg: #faeeda; --warn-fg: #633806; --info-bg: #e6f1fb; --info-fg: #0c447c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --fg: #ecebe6; --muted: #a09f99; --line: #34332f; --card: #232321;
      --accent: #5dcaa5; --warn-bg: #412402; --warn-fg: #fac775; --info-bg: #042c53; --info-fg: #b5d4f4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 600; margin: 32px 0 12px; }
  .muted { color: var(--muted); }
  section.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, input, select { font: inherit; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=number] { width: 70px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 500; color: var(--muted); border-top: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure a { display: block; aspect-ratio: 1; background: var(--line); }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { padding: 6px 8px; font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; margin: 2px 4px 0 0; }
  .badge.guess { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.info { background: var(--info-bg); color: var(--info-fg); }
  .noimg { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 12px; color: var(--muted); padding: 8px; text-align: center; }
  .error { color: #a32d2d; }
  h3 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; }
  section.trip { margin-top: 32px; padding-top: 8px; border-top: 2px solid var(--accent); }
  section.trip.loose { border-top-color: var(--line); }
  section.trip h2 { margin: 8px 0 2px; }
  .trip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  button.small, select.small { font-size: 12px; padding: 2px 6px; }
  #import-items { margin-top: 8px; max-height: 320px; overflow-y: auto; }
  .import-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 120px 120px auto auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  .import-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .import-row progress { width: 100%; }
  .import-row.failed .state { color: #a32d2d; }
  .import-row .full { grid-column: 1 / -1; font-size: 12px; }
  #past-imports { margin-top: 8px; }
  @media (max-width: 600px) { .import-row { grid-template-columns: minmax(0, 1fr) 90px auto; } .import-row .muted, .import-row progress { display: none; } }
  input:not([type=number]):not([type=file]) { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Trip Mapper</h1>
  <div class="muted" id="summary">Loading…</div>

  <section class="panel">
    <div class="row">
      <strong>Import photos</strong>
      <input type="file" id="files" multiple accept="image/*,.heic,.heif">
      <button class="primary" id="upload">Import</button>
      <span class="muted" id="import-summary"></span>
    </div>
    <input type="file" id="resume-files" multiple hidden>
    <div id="import-items"></div>
    <details id="past-imports">
      <summary class="muted">Recent imports</summary>
      <div id="imports-list"></div>
    </details>
  </section>

  <section class="panel">
    <strong>Cameras</strong>
    <span class="muted">— if a camera's clock was wrong, enter how far off it was to shift all its photos.</span>
    <table id="cameras"></table>
    <div id="offsets"></div>
  </section>

  <section class="panel">
    <strong>Homes</strong>
    <span class="muted">— photos near a home aren't counted as trips. Get coordinates from a map app (e.g. right-click a spot in Google Maps).</span>
    <div id="homes"></div>
    <form id="home-form" class="row" style="margin-top: 8px">
      <input name="name" placeholder="Name, e.g. Parents' house" required maxlength="100">
      <input name="coords" placeholder="37.7749, -122.4194" required>
      <label class="muted">within <input name="radius" type="number" value="25" min="1" max="500" step="1"> km</label>
      <button class="primary">Add home</button>
      <span class="error" id="home-error"></span>
    </form>
  </section>

  <div id="timeline"></div>
</main>

<script>
const SOURCE_LABELS = {
  exif_offset: null,
  gps: null,
  coordinates: null,
  neighbour: ["zone guessed from nearby photo", "guess"],
  default_zone: ["zone unknown, default used", "guess"],
};

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child != null) node.append(child);  // strings become text nodes, never HTML
  }
  return node;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}

function formatOffset(minutes) {
  const sign = minutes < 0 ? "−" : "+";
  const m = Math.abs(minutes);
  return `UTC${sign}${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

function formatDay(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: "UTC",
  });
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

async function act(fn) {
  try { await fn(); await refresh(); } catch (e) { alert(e.message); }
}

function json(method, body) {
  return { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
}

function formatRange(startIso, endIso) {
  const opts = { month: "short", day: "numeric", year: "numeric" };
  const start = new Date(startIso).toLocaleDateString(undefined, opts);
  const end = new Date(endIso).toLocaleDateString(undefined, opts);
  return start === end ? start : `${start} – ${end}`;
}

function photoCard(p, actions = []) {
  const media = p.thumb_key
    ? el("img", { src: `/photos/${p.id}/thumb`, loading: "lazy", alt: p.original_filename || "" })
    : el("div", { class: "noimg" }, p.processing_error ? "Can't preview this file" : "No preview");
  const link = el("a", { href: p.web_key ? `/photos/${p.id}/web` : `/photos/${p.id}`, target: "_blank" }, media);

  const caption = el("figcaption");
  if (p.local_time) {
    const time = p.local_time.slice(11, 16);
    const zone = p.tz_name || formatOffset(p.local_offset_min);
    caption.append(el("div", {}, el("strong", {}, time), " ", el("span", { class: "muted" }, zone)));
  }
  caption.append(el("div", { class: "muted" }, p.original_filename || "(no name)"));
  const label = SOURCE_LABELS[p.time_source];
  if (label) caption.append(el("span", { class: `badge ${label[1]}` }, label[0]));
  if (p.shot_at && p.lat == null) caption.append(el("span", { class: "badge info" }, "no GPS"));
  if (p.camera_model) caption.append(el("div", { class: "muted" }, p.camera_model));
  if (actions.length) caption.append(el("div", { class: "actions" }, ...actions));
  return el("figure", {}, link, caption);
}

function smallButton(label, onclick, title) {
  return el("button", { class: "small", onclick, title: title || label }, label);
}

function addToTripSelect(p, trips) {
  if (!trips.length) return null;
  const select = el("select", { class: "small", "aria-label": "Add to trip",
    onchange: () => act(() => api(`/photos/${p.id}/trip`, json("PUT", { trip_id: select.value }))) },
    el("option", { value: "" }, "Add to trip…"),
    ...trips.map(t => el("option", { value: t.id }, t.name || formatRange(t.start, t.end))));
  return select;
}

function dayBlocks(days, cardFor) {
  return days.flatMap(day => [
    el("h3", {}, formatDay(day.date), " ", el("span", { class: "muted" }, `· ${plural(day.photos.length, "photo")}`)),
    el("div", { class: "grid" }, ...day.photos.map(cardFor)),
  ]);
}

function tripSection(trip, next, allTrips) {
  const title = trip.name || formatRange(trip.start, trip.end);
  const stats = [
    trip.name ? formatRange(trip.start, trip.end) : null,
    plural(trip.day_count, "day"),
    plural(trip.photo_count, "photo"),
    trip.distance_km ? `${Math.round(trip.distance_km).toLocaleString()} km` : null,
  ].filter(Boolean).join(" · ");

  const buttons = [
    smallButton("Rename", () => {
      const name = prompt("Trip name (leave empty to use the dates):", trip.name || "");
      if (name === null) return;
      act(() => api(`/trips/${trip.id}`, json("PATCH", { name: name.trim() || null })));
    }),
    next ? smallButton("Merge with next", () => act(() =>
      api(`/trips/${trip.id}/merge`, json("POST", { trip_ids: [next.id] }))),
      `Merge "${next.name || formatRange(next.start, next.end)}" into this trip`) : null,
    smallButton("Not a trip", () => {
      if (confirm("Take all these photos out of trips? They won't be regrouped automatically."))
        act(() => api(`/trips/${trip.id}`, { method: "DELETE" }));
    }),
  ];

  const firstId = trip.days[0]?.photos[0]?.id;
  const cardFor = p => photoCard(p, [
    p.shot_at && p.id !== firstId ? smallButton("Split here", () => act(() =>
      api(`/trips/${trip.id}/split`, json("POST", { at: p.shot_at }))),
      "Start a new trip from this photo") : null,
    smallButton("Remove", () => act(() => api(`/photos/${p.id}/trip`, json("PUT", { trip_id: null }))),
      "Take this photo out of the trip"),
  ].filter(Boolean));

  return el("section", { class: "trip" },
    el("div", { class: "trip-head" },
      el("div", {},
        el("h2", {}, title, " ", trip.is_locked ? el("span", { class: "badge info" }, "edited") : null),
        el("div", { class: "muted" }, stats)),
      el("div", { class: "row" }, ...buttons.filter(Boolean))),
    ...dayBlocks(trip.days, cardFor),
    ...(trip.undated.length ? [el("h3", {}, "Undated"), el("div", { class: "grid" }, ...trip.undated.map(cardFor))] : []),
  );
}

async function renderTimeline() {
  const data = await api("/timeline");
  const root = document.getElementById("timeline");
  root.replaceChildren();
  const trips = data.trips;
  const looseCard = p => photoCard(p, [addToTripSelect(p, trips)].filter(Boolean));

  trips.forEach((trip, i) => root.append(tripSection(trip, trips[i + 1], trips)));

  const loose = data.not_in_trip.reduce((n, d) => n + d.photos.length, 0);
  if (loose) {
    root.append(el("section", { class: "trip loose" },
      el("h2", {}, "Not in a trip ", el("span", { class: "muted" }, `· ${plural(loose, "photo")} at home, in small groups, or removed`)),
      ...dayBlocks(data.not_in_trip, looseCard)));
  }
  if (data.undated.length) {
    root.append(el("section", { class: "trip loose" },
      el("h2", {}, "Undated ", el("span", { class: "muted" }, `· ${plural(data.undated.length, "photo")} with no time information`)),
      el("div", { class: "grid" }, ...data.undated.map(looseCard))));
  }

  const inTrips = trips.reduce((n, t) => n + t.photo_count, 0);
  const total = inTrips + loose + data.undated.length;
  document.getElementById("summary").textContent = total
    ? `${plural(total, "photo")} · ${plural(trips.length, "trip")}`
    : "No photos yet — upload some below.";
}

async function renderHomes() {
  const homes = await api("/homes");
  const list = document.getElementById("homes");
  list.replaceChildren(...homes.map(h => el("div", { class: "row" },
    el("span", {}, `${h.name}: ${h.lat.toFixed(4)}, ${h.lon.toFixed(4)} (within ${h.radius_km} km)`),
    smallButton("Remove", () => act(() => api(`/homes/${h.id}`, { method: "DELETE" }))))));
  if (!homes.length) list.append(el("div", { class: "muted" }, "No home set: photos taken at home may be grouped into trips."));
}

document.getElementById("home-form").addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const [lat, lon] = form.coords.value.split(",").map(s => Number(s.trim()));
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    document.getElementById("home-error").textContent = "Enter coordinates as: latitude, longitude";
    return;
  }
  document.getElementById("home-error").textContent = "";
  act(async () => {
    await api("/homes", json("POST", { name: form.name.value.trim(), lat, lon, radius_km: Number(form.radius.value) }));
    form.reset();
  });
});

async function renderCameras() {
  const [cameras, offsets] = await Promise.all([api("/cameras"), api("/camera-offsets")]);
  const table = document.getElementById("cameras");
  table.replaceChildren(el("tr", {}, el("th", {}, "Camera"), el("th", {}, "Photos"), el("th", {}, "Clock was off by")));
  for (const c of cameras) {
    const hours = el("input", { type: "number", value: "0", step: "1", "aria-label": "hours" });
    const minutes = el("input", { type: "number", value: "0", step: "1", "aria-label": "minutes" });
    const direction = el("select", { "aria-label": "direction" },
      el("option", { value: "1" }, "behind (add time)"),
      el("option", { value: "-1" }, "ahead (subtract time)"));
    const apply = el("button", {
      onclick: async () => {
        const seconds = Number(direction.value) * (Number(hours.value) * 3600 + Number(minutes.value) * 60);
        if (!seconds) return;
        const existing = offsets.filter(o =>
          o.camera_make === c.camera_make && o.camera_model === c.camera_model &&
          o.camera_serial === c.camera_serial);
        if (existing.length && !confirm("Replace this camera's existing clock correction?")) return;
        try {
          for (const o of existing) await api(`/camera-offsets/${o.id}`, { method: "DELETE" });
          await api("/camera-offsets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              camera_make: c.camera_make, camera_model: c.camera_model,
              camera_serial: c.camera_serial, offset_seconds: seconds,
            }),
          });
          await refresh();
        } catch (e) { alert(e.message); }
      },
    }, "Apply");
    const name = [c.camera_make, c.camera_model].join(" ") + (c.camera_serial ? ` (#${c.camera_serial})` : "");
    table.append(el("tr", {},
      el("td", {}, name),
      el("td", {}, String(c.photo_count)),
      el("td", {}, el("div", { class: "row" }, hours, "h", minutes, "m", direction, apply)),
    ));
  }
  if (!cameras.length) table.append(el("tr", {}, el("td", { class: "muted" }, "No camera information yet.")));

  const list = document.getElementById("offsets");
  list.replaceChildren();
  for (const o of offsets) {
    const sign = o.offset_seconds >= 0 ? "+" : "−";
    const abs = Math.abs(o.offset_seconds);
    const text = `${o.camera_make} ${o.camera_model}: ${sign}${Math.floor(abs / 3600)}h ${Math.floor(abs % 3600 / 60)}m applied`;
    list.append(el("div", { class: "row" }, el("span", { class: "muted" }, text),
      el("button", { onclick: async () => { await api(`/camera-offsets/${o.id}`, { method: "DELETE" }); await refresh(); } }, "Remove")));
  }
}

async function refresh() {
  try {
    await Promise.all([renderTimeline(), renderCameras(), renderHomes()]);
  } catch (e) {
    document.getElementById("summary").replaceChildren(el("span", { class: "error" }, `Failed to load: ${e.message}`));
  }
}

// ---- Bulk import ----------------------------------------------------------------
// The browser hashes each file, registers the whole batch in one request (files the
// server already has come back as duplicates), then uploads the rest straight to
// storage 4 at a time and asks the server to process each one.

const PARALLEL_UPLOADS = 4;
const UPLOADABLE = /^(image\/(?!svg)[\w.+-]+|application\/octet-stream)$/;
const importState = { id: null, items: [], files: new Map(), progress: new Map() };

async function sha256Hex(file) {
  const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function formatSize(bytes) {
  return bytes > 1e6 ? `${(bytes / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1e3))} KB`;
}

async function pool(tasks, limit) {
  let next = 0;
  const worker = async () => { while (next < tasks.length) await tasks[next++](); };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
}

// fetch() can't report upload progress, so the PUT uses XMLHttpRequest.
function putWithProgress(url, file, contentType, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", url);
    xhr.setRequestHeader("Content-Type", contentType);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(`storage rejected the upload (${xhr.status})`));
    xhr.onerror = () => reject(new Error("network error during upload"));
    xhr.send(file);
  });
}

function setItem(item) {
  const i = importState.items.findIndex(x => x.id === item.id);
  importState.items[i] = { ...importState.items[i], ...item };
  renderImport();
}

async function uploadItem(item) {
  const file = importState.files.get(item.id);
  const base = `/imports/${importState.id}/items/${item.id}`;
  // A renewal can report the file already finished (e.g. a lost response); then we're done.
  const renew = async () => {
    const renewed = await api(`${base}/upload-url`, { method: "POST" });
    if (!renewed.upload_url) setItem(renewed);
    return renewed;
  };
  try {
    if (!item.upload_url || item.status === "failed") {
      item = await renew();
      if (!item.upload_url) return;
    }
    setItem({ ...item, status: "uploading" });
    const onProgress = p => { importState.progress.set(item.id, p); renderImport(); };
    try {
      await putWithProgress(item.upload_url, file, item.content_type, onProgress);
    } catch {
      // One automatic retry with a fresh URL: covers expired URLs in long imports and
      // brief network blips. A second failure is reported and shown with a Retry button.
      item = await renew();
      if (!item.upload_url) return;
      await putWithProgress(item.upload_url, file, item.content_type, onProgress);
    }
    importState.progress.set(item.id, 1);
    setItem({ ...item, status: "processing" });
    setItem(await api(`${base}/complete`, { method: "POST" }));
  } catch (e) {
    try {
      setItem(await api(`${base}/failed`, json("POST", { error: e.message.slice(0, 500) })));
    } catch {
      setItem({ ...item, status: "failed", failed_stage: "upload", error: e.message });
    }
  }
}

async function retryItem(item) {
  if (item.failed_stage === "processing") {
    setItem({ ...item, status: "processing" });
    setItem(await api(`/imports/${importState.id}/items/${item.id}/complete`, { method: "POST" }));
  } else if (importState.files.has(item.id)) {
    await uploadItem(item);
  } else {
    document.getElementById("resume-files").click();  // file isn't in memory: pick it again
  }
  await refresh();
}

async function startImport(files) {
  const summary = document.getElementById("import-summary");
  const skipped = files.filter(f => !UPLOADABLE.test(f.type || "application/octet-stream"));
  files = files.filter(f => !skipped.includes(f));
  if (!files.length) {
    summary.textContent = skipped.length ? "Only image files can be imported." : "";
    return;
  }
  summary.textContent = `Checking ${plural(files.length, "file")} for duplicates…`;
  // The same file picked twice (e.g. from two folders) is only sent once.
  const described = [], unique = [], seen = new Set();
  let repeats = 0;
  for (const f of files) {
    const sha256 = await sha256Hex(f);
    if (seen.has(sha256)) { repeats++; continue; }
    seen.add(sha256);
    unique.push(f);
    described.push({ filename: f.name, content_type: f.type || "application/octet-stream",
                     size_bytes: f.size, sha256 });
  }
  const imp = await api("/imports", json("POST", { files: described }));
  Object.assign(importState, { id: imp.id, items: imp.items, files: new Map(), progress: new Map() });
  imp.items.forEach((item, i) => importState.files.set(item.id, unique[i]));
  importState.skipped = skipped.map(f => f.name);
  importState.repeats = repeats;
  renderImport();

  await pool(imp.items.filter(i => i.status === "uploading").map(i => () => uploadItem(i)), PARALLEL_UPLOADS);
  await Promise.all([refresh(), renderPastImports()]);
}

async function resumeImport(files) {
  // Match re-picked files to this import's unfinished items by content hash.
  const byHash = new Map(importState.items
    .filter(i => i.status === "uploading" || (i.status === "failed" && i.failed_stage === "upload"))
    .map(i => [i.declared_sha256, i]));
  const matched = [];
  for (const f of files) {
    const item = byHash.get(await sha256Hex(f));
    if (item) { importState.files.set(item.id, f); matched.push(item); }
  }
  document.getElementById("import-summary").textContent =
    `Resuming ${plural(matched.length, "file")}${files.length > matched.length ? ` (${files.length - matched.length} didn't match)` : ""}.`;
  await pool(matched.map(i => () => uploadItem({ ...i, upload_url: null })), PARALLEL_UPLOADS);
  await Promise.all([refresh(), renderPastImports()]);
}

async function openImport(id) {
  const imp = await api(`/imports/${id}`);
  Object.assign(importState, { id: imp.id, items: imp.items, files: new Map(), progress: new Map(), skipped: [], repeats: 0 });
  renderImport();
}

const STATUS_TEXT = {
  uploading: "waiting", processing: "processing", done: "imported",
  duplicate: "already imported", failed: "failed",
};

function renderImport() {
  const { items, progress } = importState;
  const list = document.getElementById("import-items");
  if (!items.length) { list.replaceChildren(); return; }
  const count = s => items.filter(i => i.status === s).length;
  const finished = count("done") + count("duplicate");
  const parts = [`${finished} of ${items.length} done`];
  if (count("duplicate")) parts.push(`${count("duplicate")} already imported`);
  if (count("failed")) parts.push(`${count("failed")} failed`);
  if (importState.skipped?.length) parts.push(`${importState.skipped.length} skipped (not images)`);
  if (importState.repeats) parts.push(`${importState.repeats} selected twice, sent once`);
  document.getElementById("import-summary").textContent = parts.join(" · ");

  // Files that still need uploading but aren't in memory (the page was reloaded).
  const needFiles = items.filter(i => !importState.files.has(i.id) &&
    (i.status === "uploading" || (i.status === "failed" && i.failed_stage === "upload")));
  const resume = needFiles.length
    ? el("div", { class: "row" },
        el("span", {}, `${plural(needFiles.length, "file")} still ${needFiles.length === 1 ? "needs" : "need"} uploading.`),
        smallButton("Choose them again to resume", () => document.getElementById("resume-files").click()))
    : null;

  // Only list what needs attention or is in flight; finished files are just counted.
  const shown = items.filter(i => !["done", "duplicate"].includes(i.status) || progress.has(i.id));
  list.replaceChildren(...[resume].filter(Boolean), ...shown.slice(0, 200).map(item => {
    const pct = Math.round((progress.get(item.id) || 0) * 100);
    const active = item.status === "uploading" && progress.has(item.id) && pct < 100;
    const label = active ? `uploading ${pct}%` : STATUS_TEXT[item.status];
    const retry = item.status === "failed"
      ? smallButton(item.failed_stage === "processing" ? "Retry processing" : "Retry upload",
                    () => retryItem(item).catch(e => alert(e.message)))
      : null;
    const link = item.photo_id && ["done", "duplicate"].includes(item.status)
      ? el("a", { href: `/photos/${item.photo_id}/web`, target: "_blank" }, "view") : null;
    return el("div", { class: `import-row ${item.status}` },
      el("span", { class: "name" }, item.filename || "(no name)"),
      el("span", { class: "muted" }, formatSize(item.size_bytes)),
      el("progress", { max: "100", value: String(item.status === "uploading" ? pct : 100) }),
      el("span", { class: "state" }, label),
      link, retry,
      item.error ? el("div", { class: "error full" }, item.error) : null);
  }));
}

async function renderPastImports() {
  const list = document.getElementById("imports-list");
  const past = await api("/imports");
  list.replaceChildren(...past.map(p => {
    const c = p.counts;
    const bits = [`${c.done + c.duplicate} of ${c.total} done`];
    if (c.failed) bits.push(`${c.failed} failed`);
    if (c.uploading) bits.push(`${c.uploading} not uploaded`);
    return el("div", { class: "row" },
      el("span", {}, new Date(p.created_at).toLocaleString()),
      el("span", { class: "muted" }, bits.join(" · ")),
      c.failed || c.uploading ? smallButton("Open", () => openImport(p.id)) : null);
  }));
  if (!past.length) list.append(el("div", { class: "muted" }, "No imports yet."));
}

document.getElementById("upload").addEventListener("click", () => {
  const input = document.getElementById("files");
  startImport([...input.files]).catch(e => alert(e.message)).finally(() => { input.value = ""; });
});
document.getElementById("resume-files").addEventListener("change", e => {
  resumeImport([...e.target.files]).catch(err => alert(err.message)).finally(() => { e.target.value = ""; });
});

renderPastImports();

refresh();
</script>
</body>
