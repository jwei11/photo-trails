# The whole stack: cp .env.example .env, then docker compose up --build, then open
# http://localhost:8000. For development on the Mac, run only `docker compose up -d --wait
# db objects` and run the API, worker, and Vite outside Docker (see README).
#
# Inside this network, services reach each other by service name (db, objects), never
# localhost: in a container, localhost is that container itself. Published ports bind to
# 127.0.0.1 only, so nothing here is reachable from other machines on the network.

# Settings shared by every container that runs the app's image. ${VAR:?msg} stops compose
# with that message if .env doesn't set VAR, rather than starting with an empty password.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set it in .env (copy .env.example)}:${POSTGRES_PASSWORD:?set it in .env}@db:5432/${POSTGRES_DB:?set it in .env}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
  # The API reaches storage at DOCKER_S3_ENDPOINT (http://objects:8333 for the SeaweedFS
  # below). Without it, S3_ENDPOINT, which is empty for Amazon S3. Browsers still get URLs
  # signed for S3_PUBLIC_ENDPOINT, a host they can reach.
  S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-${S3_ENDPOINT:-}}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set it in .env}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set it in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set it in .env}
  APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8000}
  # Optional: sign in with Google (see README). Without it, sign in with a one-time link.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Read only by migration 0010, to give a database's existing photos an owner.
  OWNER_EMAIL: ${OWNER_EMAIL:-}

# One image runs four services with different commands. Only the api service builds it:
# if each had `build: .`, compose would build the same image four times over. The others
# use it as built, and none ever pull: trip-mapper-app on Docker Hub would be a
# stranger's image. `pull_policy: build` also rebuilds on every `up` (seconds, from the
# cache), so new code never runs on an old image.
x-app: &app
  image: trip-mapper-app
  pull_policy: never
  environment: *app-env

services:
  db:
    build: docker/db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object store for tests and offline development. MinIO stopped publishing
  # images in 2025; SeaweedFS only publishes `latest`, so pin the exact digest.
  objects:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      # Its own credentials, separate from the app's S3_* ones, which may be AWS keys.
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?set it in .env}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?set it in .env}
    # Credentials are written from env vars at start, so no secret lives in a committed file.
    entrypoint:
      - sh
      - -c
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$SEAWEEDFS_ACCESS_KEY" "$$SEAWEEDFS_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=256 -volume.max=40 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:${OBJECTS_PORT:-8333}:8333"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies database migrations, then exits. The API and worker wait for it to succeed, so
  # they never run against an old schema, and it runs once however many of them start.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck: {disable: true}

  # Loads GeoNames and Natural Earth on first start (about 23 MB of downloads, cached in a
  # volume); later starts see place data is there and exit at once. Nothing waits for it:
  # the app works meanwhile, and photos get their place names when it finishes.
  geodata:
    <<: *app
    command: ["python", "-m", "app.geodata", "load", "--if-empty"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes:
      - geodata:/app/data/geo
    healthcheck: {disable: true}

  api:
    <<: *app
    build: .
    pull_policy: build
    # Restarted if it crashes (say, the database was briefly unreachable at startup), but
    # not when Docker itself starts, unlike unless-stopped: after the Mac wakes, the full
    # stack stays down until asked for, leaving port 8000 free for the API run on the Mac.
    restart: on-failure
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      objects: {condition: service_healthy}

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    restart: on-failure
    environment:
      <<: *app-env
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    # Healthy while the heartbeat is under a minute old: the worker touches it each time it
    # reaches the queue, so a hung worker or a lost database turns this unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    # docker stop sends SIGTERM, then SIGKILL after this long: time to finish current jobs.
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      objects: {condition: service_healthy}

volumes:
  pgdata:
  objectdata:
  geodata:
